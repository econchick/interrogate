# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  # Allow rebuilds via API.
  repository_dispatch:
    types: [rebuild]

env:
  FORCE_COLOR: "1"
  PYTHON_LATEST: "3.13"

jobs:
  pre-commit:
    name: "Pre-commit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run pre-commit
        run: |
          uvx pre-commit run --all-files

  tests:
    name: "Python ${{ matrix.python-version }} on Ubuntu"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install dependencies"
        run: |
          uv sync

      - name: Run tox targets for ${{ matrix.python-version }}
        run: uv run tox -f py$(echo ${{ matrix.python-version }} | tr -d .)

      - name: Run mypy
        run: uv run tox run -e mypy
        if: matrix.python-version == '3.13'

      - name: Check MANIFEST.in
        run: uv run tox run -e manifest
        if: matrix.python-version == '3.13'

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.python-version }}
          path: ".coverage.*"
          include-hidden-files: true

  coverage:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Use latest Python, so it understands all syntax.
          python-version: ${{env.PYTHON_LATEST}}
      - name: Install dependencies
        run: uv sync

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          merge-multiple: true
      - run: ls -R .

      - name: "Combine coverage and fail if it's <98%."
        run: |
          uv run coverage combine

          uv run coverage html --skip-covered --skip-empty

          # Report and write to summary.
          uv run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
          # Report again and fail if under 98%.
          uv run coverage report --fail-under=98
      - name: Upload HTML report if check failed.
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: htmlcov
          include-hidden-files: true
        if: ${{ failure() }}

  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@v2

  install-dev:
    name: "Verify Dev Env on ${{ matrix.os }}"
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{env.PYTHON_LATEST}}
      - name: "Import package"
        run: echo 'import interrogate; print(interrogate.__version__)' | uv run -
      - name: "Create a badge"
        run: uv run interrogate --config pyproject.toml --generate-badge . src tests
        if: runner.os != 'Windows'
        env:
          # TODO: set for only macos
          DYLD_FALLBACK_LIBRARY_PATH: "/opt/homebrew/lib"

  docs:
    name: Check docs
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{env.PYTHON_LATEST}}

      - run: uv run tox run -e docs

  # Ensure everything required is passing for branch protection.
  required-checks-pass:
    if: always()

    needs:
      - pre-commit
      - build-package
      - coverage
      - install-dev
      - docs

    runs-on: ubuntu-latest

    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
